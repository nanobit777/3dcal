{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PrintControl 3D{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f5f7fb; }
        [data-bs-theme="dark"] body { background: #0f172a; }
        .card { border: 0; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
        .navbar-brand { font-weight: 700; letter-spacing: .3px; }
        .table > :not(caption) > * > * { vertical-align: middle; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'calculator' %}"><i class="bi bi-printer"></i> PrintControl 3D</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'calculator' %}active{% endif %}"
                       href="{% url 'calculator' %}"><i class="bi bi-calculator"></i> Calculadora</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'filament_list' %}active{% endif %}"
                       href="{% url 'filament_list' %}"><i class="bi bi-box-seam"></i> Filamentos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'quote_history' %}active{% endif %}"
                       href="{% url 'quote_history' %}"><i class="bi bi-clock-history"></i> Historial</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}"
                       href="{% url 'settings' %}"><i class="bi bi-sliders"></i> Configuración</a>
                </li>
            </ul>
            <button class="btn btn-outline-light btn-sm" id="themeToggle" type="button">
                <i class="bi bi-moon-stars"></i> Tema
            </button>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% if request.GET.ok %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            Operación realizada correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem('pc3d-theme') || 'light';
    root.setAttribute('data-bs-theme', savedTheme);
    document.getElementById('themeToggle')?.addEventListener('click', () => {
        const next = root.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-bs-theme', next);
        localStorage.setItem('pc3d-theme', next);
    });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
